<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#202124">
    <title>CalcJS Scientific</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <header>
            <div>
                <p>SCIENTIFIC CALCULATOR</p>
                <h1>CalcJS</h1>
            </div>
            <button id="angleMode" class="mode">DEG</button>
        </header>

        <section class="display-panel">
            <div id="previous"></div>
            <div id="display">0</div>
            <div id="error"></div>
        </section>

        <section class="keypad">
            <button data-action="history">HIST</button>
            <button data-value="(">(</button>
            <button data-value=")">)</button>
            <button data-action="backspace">⌫</button>
            <button class="danger" data-action="clear">C</button>

            <button class="fn" data-value="sin(">sin</button>
            <button class="fn" data-value="cos(">cos</button>
            <button class="fn" data-value="tan(">tan</button>
            <button class="fn" data-value="sqrt(">√</button>
            <button class="fn" data-value="^2">x²</button>

            <button class="fn" data-value="asin(">sin⁻¹</button>
            <button class="fn" data-value="acos(">cos⁻¹</button>
            <button class="fn" data-value="atan(">tan⁻¹</button>
            <button class="fn" data-value="log(">log</button>
            <button class="fn" data-value="ln(">ln</button>

            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button class="op" data-value="/">÷</button>
            <button class="fn" data-value="^">xʸ</button>

            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button class="op" data-value="*">×</button>
            <button class="fn" data-value="pi">π</button>

            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>
            <button class="op" data-value="-">−</button>
            <button class="fn" data-value="e">e</button>

            <button data-value="0">0</button>
            <button data-value=".">.</button>
            <button class="fn" data-value="%">%</button>
            <button class="op" data-value="+">+</button>
            <button class="equals" data-action="equals">=</button>
        </section>

        <section id="historyPanel" hidden>
            <h2>History
                <button id="clearHistory">Clear</button>
            </h2>
            <div id="historyList"></div>
        </section>

        <footer>CalcJS • Scientific Calculator</footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
